<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SC Forms — примеры подключения</title>
  <link rel="stylesheet" href="assets/sc-forms.css">
  <script defer src="assets/sc-forms.js" data-endpoint="../form.php"></script>
  <style>body{max-width:960px;margin:50px auto;padding:0 24px;background:#f5f7fa;color:#202733;font:16px/1.6 system-ui}h1{font-size:36px}main{display:grid;grid-template-columns:1fr 1fr;gap:40px}section{padding:24px;background:#fff;border-radius:12px}.examples{display:flex;flex-wrap:wrap;gap:12px}.examples button{padding:12px 16px;border:1px solid #1b6097;border-radius:6px;background:white;color:#1b6097;cursor:pointer;font:inherit}@media(max-width:700px){main{grid-template-columns:1fr}}</style>
</head>
<body>
  <h1>SC Forms</h1><p>Примеры форм в модальном окне и на странице.</p>
  <main>
    <section><h2>Открыть форму</h2><div class="examples">
      <button type="button" data-sc-form="consultation">Консультация</button>
      <button type="button" data-sc-form="requestdemo">Запросить демо</button>
      <button type="button" data-sc-form="becomeclient">Стать клиентом</button>
      <button type="button" data-sc-form="partner">Стать партнёром</button>
      <button type="button" data-sc-form="feedback">Обратная связь</button>
    </div></section>
    <section><div data-sc-form-inline="feedback"></div></section>
  </main>
</body></html>
